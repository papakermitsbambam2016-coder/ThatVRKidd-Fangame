name: Build ThatVRKidd Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  OPENXR_VENDORS_VERSION: "3.0.1-stable"

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install workflow tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip

      - name: Install Godot 4.3 OpenXR Vendors plugin
        run: |
          curl --fail --location \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" \
            --output /tmp/openxr-vendors.zip
          unzip -q /tmp/openxr-vendors.zip -d .
          test -d addons/godotopenxrvendors
          find addons/godotopenxrvendors -maxdepth 2 -type f | head -30

      - name: Import Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Quest APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --verbose \
            --install-android-build-template \
            --export-debug "Android" \
            build/ThatVRKidd-Fangame.apk

      - name: Verify Quest APK
        run: |
          test -f build/ThatVRKidd-Fangame.apk
          ls -lh build/ThatVRKidd-Fangame.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: ThatVRKidd-Fangame-Quest
          path: build/ThatVRKidd-Fangame.apk
          if-no-files-found: error
          retention-days: 30
