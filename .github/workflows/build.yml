name: Build ThatVRKidd Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config

          mv /root/.config/godot ~/.config/godot

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install workflow tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 \
            ca-certificates \
            unzip

      - name: Download compatible OpenXR Vendors plugin
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import zipfile

          query = urllib.parse.urlencode({
              "filter": "Godot OpenXR Vendors",
              "godot_version": "4.3",
              "max_results": "20"
          })

          api_url = (
              "https://godotengine.org/asset-library/api/asset?"
              + query
          )

          with urllib.request.urlopen(api_url) as response:
              data = json.load(response)

          assets = data.get("result", [])
          matches = [
              asset for asset in assets
              if "openxr vendors" in asset.get("title", "").lower()
          ]

          if not matches:
              raise RuntimeError(
                  "Compatible OpenXR Vendors plugin was not found"
              )

          download_url = matches[0]["download_url"]

          urllib.request.urlretrieve(
              download_url,
              "/tmp/openxr-vendors.zip"
          )

          with zipfile.ZipFile(
              "/tmp/openxr-vendors.zip",
              "r"
          ) as archive:
              archive.extractall(".")

          print("Installed:", matches[0]["title"])
          print("Version:", matches[0].get("version", "unknown"))
          PY

      - name: Import Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Install Android Gradle template
        run: |
          godot --headless \
            --path . \
            --install-android-build-template \
            --editor \
            --quit

      - name: Build Quest APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --verbose \
            --install-android-build-template \
            --export-debug "Android" \
            build/ThatVRKidd-Fangame.apk

      - name: Verify APK
        run: |
          test -f build/ThatVRKidd-Fangame.apk
          ls -lh build/ThatVRKidd-Fangame.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: ThatVRKidd-Fangame-Quest
          path: build/ThatVRKidd-Fangame.apk
          if-no-files-found: error
          retention-days: 30
